# Mirrors how Cloudflare Pages serves dist/ so local preview matches production.
# Kept in sync by hand with public/_headers — nginx cannot read that file.

map $sent_http_content_type $tawan_cache {
    default "public, max-age=0, must-revalidate";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 512;

    # `add_header` in a location block drops everything inherited, so the
    # security set is repeated in each location that adds a header of its own.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $tawan_cache always;

    # Content-hashed bundles — safe to cache forever.
    location /_astro/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # `$uri/` lets nginx 301 /cars to /cars/, matching Pages' directory format.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
