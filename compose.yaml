name: tawancarrent

services:
  # `docker compose up` — Astro dev server with hot reload on the source tree.
  dev:
    build:
      context: .
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      # Keeps the image's Linux-built node_modules from being shadowed by the
      # host's (Windows) copy when the bind mount lands on /app.
      - node_modules:/app/node_modules
    environment:
      # Bind mounts on Windows and macOS do not forward inotify events into the
      # container, so Vite has to poll to notice edits. See astro.config.mjs.
      DOCKER_POLLING: "1"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    stop_grace_period: 3s

  # `docker compose --profile preview up preview` — the built static site,
  # served the way Cloudflare Pages serves it.
  preview:
    build:
      context: .
      target: preview
    ports:
      - "8080:8080"
    profiles: ["preview"]

volumes:
  node_modules:
